services:
  angular-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: angular-turnos-dev
    ports:
      - "4300:4200"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.angular
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - NG_CLI_ANALYTICS=ci 
    command: ["npx", "ng", "serve", "--host", "0.0.0.0", "--port", "4200", "--poll", "1000"]